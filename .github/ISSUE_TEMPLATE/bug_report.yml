name: 🐞 버그 / 설치 실패
description: 설치가 안 되거나 프로그램이 오작동할 때
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 먼저 `doctor.bat` 을 실행해 주세요
        프로젝트 폴더에서 **doctor.bat** 을 더블클릭하면 `doctor_report.txt` 가 생성됩니다.
        그 파일 **전체 내용을 아래에 붙여넣어** 주세요.
        (API 키·토큰 같은 비밀값은 포함되지 않고, 설정 여부만 표시됩니다)
  - type: textarea
    id: doctor
    attributes:
      label: doctor_report.txt 내용
      description: 파일을 열어 전체를 복사 → 붙여넣기
      render: text
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇을 했을 때 무엇이 잘못됐는지 (에러 메시지 원문 포함)
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: 어느 단계에서 실패했나요?
      placeholder: install.bat / 대본 / 이미지 / 말풍선 / 음성 / 영상 / 업로드
  - type: input
    id: gpu
    attributes:
      label: 그래픽카드 (선택)
      placeholder: 예) NVIDIA RTX 3060 12GB / 없음(내장)
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: install.bat 을 먼저 실행했습니다
        - label: .env 에 GEMINI_API_KEY 를 입력했습니다
        - label: doctor_report.txt 를 첨부했습니다
          required: true
